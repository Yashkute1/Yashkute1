<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Yash Kute — founder of Shadowtrace Solution, building DineSlip and PC Part Hunt">
<style>
  .name { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
  .type { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9FB3C8; }
  .tag  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; fill: #5C6F84; }
  .blob { transform-box: fill-box; transform-origin: center; }
  .b1 { animation: drift1 18s ease-in-out infinite; }
  .b2 { animation: drift2 22s ease-in-out infinite; }
  .b3 { animation: drift3 26s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,40px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-140px,-30px) scale(.9); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-50px); } }
  .shield { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 0 rgba(94,234,212,0)); } 50% { filter: drop-shadow(0 0 14px rgba(94,234,212,.55)); } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .b1,.b2,.b3,.shield,.scan,.cur { animation: none; } }
</style>
<defs>
