    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="scanG" x1="0" x2="1">
    <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".09"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
  </linearGradient>
