<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Security layers. Web apps: Cloudflare, an origin firewall that only accepts Cloudflare, Caddy with strict CSP, an API with 2FA and an audit log, PostgreSQL with row-level security and encrypted nightly backups. Game servers: Kavach drops spoofed UDP in the network driver, clients prove their IP, and ShadowTrace AC flags cheaters for review.">
<style>
