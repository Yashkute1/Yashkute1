<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Security work: Kavach DDoS filter, SamrajyaAC anti-cheat, web and network testing with Burp Suite, Metasploit, Wireshark and Hashcat, DPDP compliance">
