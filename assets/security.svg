  <text x="600.0" y="27" text-anchor="middle" class="ttl">yash@shadowtrace: ~/security</text>
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#E8EDF3" stroke-opacity=".07"/>
  <text x="60" y="92" class="p" opacity="0">$<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.0000;1"/></text><text x="78" y="92" class="cmd" clip-path="url(#t0)">kavach status</text><text x="78" y="116" class="out" opacity="0">→ xdp filter on · spoofed and reflected UDP dropped in the driver<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0789;0.0921;1"/></text><text x="60" y="145" class="p" opacity="0">$<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.1684;1"/></text><text x="78" y="145" class="cmd" clip-path="url(#t1)">samrajyaac verdicts --today</text><text x="78" y="169" class="out" opacity="0">→ aim, recoil and hit-map checks on live Rust players<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2474;0.2605;1"/></text><text x="60" y="198" class="p" opacity="0">$<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.3368;1"/></text><text x="78" y="198" class="cmd" clip-path="url(#t2)">burpsuite &amp;&amp; msfconsole</text><text x="78" y="222" class="out" opacity="0">→ web app testing and exploit practice in my lab<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4158;0.4289;1"/></text><text x="60" y="251" class="p" opacity="0">$<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.5053;1"/></text><text x="78" y="251" class="cmd" clip-path="url(#t3)">wireshark -i eth0 / hashcat -m 13000</text><text x="78" y="275" class="out" opacity="0">→ packet captures, password audits<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.5842;0.5974;1"/></text><text x="60" y="304" class="p" opacity="0">$<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.6737;1"/></text><text x="78" y="304" class="cmd" clip-path="url(#t4)">dpdp-audit dineslip</text><text x="78" y="328" class="out" opacity="0">→ consent, retention and breach steps under India&#x27;s DPDP Act<animate attributeName="opacity" dur="19.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7526;0.7658;1"/></text>
