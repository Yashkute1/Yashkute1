  .lg { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6B7C8E; }
  .r { animation: rise .7s cubic-bezier(0.23, 1, 0.32, 1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .r { animation: none; opacity: 1; transform: none; } .pk { display: none; } }
</style>
