<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-label="Kavach: DDoS scrubbing node. An XDP filter drops spoofed UDP in the NIC driver; a Go proxy makes clients prove their IP first.">
<style>
  .title { font: 700 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #E8EDF3; letter-spacing: -.3px; }
  .kind { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #EF4444; }
  .body { font: 400 14.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9FB3C8; }
  .chip { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #C9D6E3; }
  .live { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #22C55E; }
  .stat { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5C6F84; }
  .sweep { animation: sweep 7s ease-in-out 1.4s infinite; }
  @keyframes sweep { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(640px); } }
  .glow { animation: glow 5s ease-in-out 1.4s infinite; }
  @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .sweep, .glow { animation: none; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131A"/><stop offset="1" stop-color="#0B0E12"/></linearGradient>
  <radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#EF4444" stop-opacity=".28"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#EF4444"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/></linearGradient>
  <clipPath id="k"><rect width="440" height="210" rx="16"/></clipPath>
</defs>
<g clip-path="url(#k)">
  <rect width="440" height="210" fill="url(#bg)"/>
  <rect width="260" height="200" fill="url(#corner)" class="glow"/>
  <g class="sweep"><rect x="-120" y="0" width="120" height="210" fill="url(#sw)" transform="skewX(-18)"/></g>
  <rect x="0" y="0" width="440" height="3" fill="url(#edge)"/>
  <rect x=".5" y=".5" width="439" height="209" rx="16" fill="none" stroke="#E8EDF3" stroke-opacity=".09"/>
  <text x="24" y="36" class="kind">SECURITY</text>
  <text x="24" y="68" class="title">Kavach</text>
  
  <text x="24" y="98" class="body">DDoS scrubbing node. An XDP filter drops</text><text x="24" y="119" class="body">spoofed UDP in the NIC driver; a Go proxy</text><text x="24" y="140" class="body">makes clients prove their IP first.</text>
  <rect x="24" y="166" width="29" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="38" y="182" text-anchor="middle" class="chip">Go</text><rect x="60.8" y="166" width="73" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="97" y="182" text-anchor="middle" class="chip">eBPF/XDP</text><rect x="142.0" y="166" width="21" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="153" y="182" text-anchor="middle" class="chip">C</text><rect x="171.4" y="166" width="73" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="208" y="182" text-anchor="middle" class="chip">nftables</text>
  <text x="416" y="182" text-anchor="end" class="stat">private repo</text>
</g>
</svg>
