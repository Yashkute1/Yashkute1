<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-label="PC Part Hunt: PC part prices from nine Indian stores, matched into one row per part, with price history.">
<style>
  .title { font: 700 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #E8EDF3; letter-spacing: -.3px; }
  .kind { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #22C55E; }
  .body { font: 400 14.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9FB3C8; }
  .chip { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #C9D6E3; }
  .live { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #22C55E; }
  .stat { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5C6F84; }
  .sweep { animation: sweep 7s ease-in-out 0.7s infinite; }
  @keyframes sweep { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(640px); } }
  .glow { animation: glow 5s ease-in-out 0.7s infinite; }
  @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .sweep, .glow { animation: none; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131A"/><stop offset="1" stop-color="#0B0E12"/></linearGradient>
  <radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#22C55E" stop-opacity=".28"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient>
  <clipPath id="k"><rect width="440" height="210" rx="16"/></clipPath>
</defs>
<g clip-path="url(#k)">
  <rect width="440" height="210" fill="url(#bg)"/>
  <rect width="260" height="200" fill="url(#corner)" class="glow"/>
  <g class="sweep"><rect x="-120" y="0" width="120" height="210" fill="url(#sw)" transform="skewX(-18)"/></g>
  <rect x="0" y="0" width="440" height="3" fill="url(#edge)"/>
  <rect x=".5" y=".5" width="439" height="209" rx="16" fill="none" stroke="#E8EDF3" stroke-opacity=".09"/>
  <text x="24" y="36" class="kind">PRODUCT</text>
  <text x="24" y="68" class="title">PC Part Hunt</text>
  <circle cx="410" cy="30" r="4" fill="#22C55E"><animate attributeName="r" values="4;4;4" dur="2s" repeatCount="indefinite"/></circle><circle cx="410" cy="30" r="4" fill="none" stroke="#22C55E" stroke-width="2"><animate attributeName="r" values="4;11" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle><text x="396" y="34" text-anchor="end" class="live">LIVE</text>
  <text x="24" y="98" class="body">PC part prices from nine Indian stores,</text><text x="24" y="119" class="body">matched into one row per part, with</text><text x="24" y="140" class="body">price history.</text>
  <rect x="24" y="166" width="51" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="50" y="182" text-anchor="middle" class="chip">Astro</text><rect x="83.0" y="166" width="58" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="112" y="182" text-anchor="middle" class="chip">Python</text><rect x="149.4" y="166" width="51" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="175" y="182" text-anchor="middle" class="chip">MySQL</text><rect x="208.4" y="166" width="66" height="24" rx="12" fill="#E8EDF3" fill-opacity=".06" stroke="#E8EDF3" stroke-opacity=".10"/><text x="241" y="182" text-anchor="middle" class="chip">Actions</text>
  <text x="416" y="182" text-anchor="end" class="stat">pcparthunt.com</text>
</g>
</svg>
